[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-fit"
version = "0.2.1"
description = "Will this LLM fit on this GPU? vLLM memory maths: weights, KV cache, context and concurrency."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kiran Tallapragada" }]
keywords = ["llm", "vllm", "gpu", "kv-cache", "inference", "vram", "self-hosting"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
gpu-fit = "gpu_fit.cli:main"

[project.urls]
Homepage = "https://github.com/KiranTallapragada/gpu-fit"

[tool.setuptools.packages.find]
where = ["src"]
